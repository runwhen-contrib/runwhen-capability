[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runwhen-capability"
dynamic = ["version"]
description = "SDK and task host (rwtask) for RunWhen capability images"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6",
    "requests>=2.31",
    # An early 413/503 relay response is only readable mid-upload on urllib3 2.x.
    "urllib3>=2",
    "jsonschema[format-nongpl]>=4.23,<5",
]

[project.urls]
Source = "https://github.com/runwhen-contrib/runwhen-capability"

[project.scripts]
rwtask = "runwhen_capability.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1",
    # Generates contracts/models; the pin is exact because the output is committed.
    "datamodel-code-generator==0.88.0",
    "openapi-spec-validator==0.9.0",
    "pytest>=8",
    "responses>=0.25",
    "ruff==0.17.3",
]

[tool.setuptools.dynamic]
version = { attr = "runwhen_capability.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The packaged copy of contracts/ (see scripts/sync_contracts.py).
[tool.setuptools.package-data]
"runwhen_capability.contracts" = ["_data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tests/fixtures/repo is deliberately "dirty" fixture data that static-check
# tools are meant to flag -- not code we lint.
extend-exclude = ["tests/fixtures/repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
