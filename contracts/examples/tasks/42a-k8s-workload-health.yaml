# source: 42a-skill-spec.md "## tasks.yaml"
# yaml-language-server: $schema=https://schemas.runwhen.com/tasks/v1.json
apiVersion: runwhen.com/tasks/v1
runtime: kubernetes@1                       # default generic@1
defaults:
  credentials: kubernetes/kubeconfig        # D38: a credential type; a connection supplies it
  timeout: 120s
  resources: { cpu: 250m, memory: 256Mi }
settings:                                   # D41: admin-set per workspace install, with defaults
  restartThreshold: { type: integer, default: 5, description: Restarts in the window that count as unhealthy }
tasks:
  - name: rollout-status
    title: Rollout status
    description: Is the latest rollout progressing, stuck or failed, and why?
    script: scripts/rollout_status.py
    tags: [rollout]
    readOnly: true
    permissions:
      - { apiGroups: [apps], resources: [deployments, replicasets], verbs: [get, list] }
      - { apiGroups: [""], resources: [events], verbs: [list] }
    timeout: 60s
    inputs:
      since: { type: duration, default: 30m, description: Look-back window }
    outputs:
      rollout:  { schema: ./schemas/rollout.v1.json, description: Rollout state per ReplicaSet }
      events:   { artifact: { contentType: application/x-ndjson, maxSize: 50Mi } }

  - name: restart
    title: Restart workload
    description: Rolling restart of the workload.
    script: scripts/restart.sh
    readOnly: false
    effects: ["Restarts every pod of the workload, one at a time"]
    destructive: false
    idempotent: true
    permissions: [{ apiGroups: [apps], resources: [deployments], verbs: [patch] }]
    inputs:
      reason: { type: string, description: Why; recorded as an annotation }
    outputs:
      result: { schema: "{ restartedAt: datetime, pods: integer }" }
