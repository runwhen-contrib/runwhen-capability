# source: synthetic (no wiki example); a credential type that marks its non-secret variables (contracts-v5)
platform: postgres
types:
  instance: { root: true, rootKey: [host, port], plural: instances }
credentialTypes:
  postgres/connection:
    materialize:
      env: [PGHOST, PGPORT, PGUSER, PGDATABASE, PGSSLMODE, PGPASSWORD]
      nonSecret: [PGHOST, PGPORT, PGUSER, PGDATABASE, PGSSLMODE]   # only PGPASSWORD is redacted from task output
authMethods: { password: { produces: postgres/connection, accepts: [k8s-secret, vault], native: passthrough } }
entryPoints: {}
