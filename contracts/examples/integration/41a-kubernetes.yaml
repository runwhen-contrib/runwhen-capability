# source: 41a-integration-spec.md "## integration.yaml"
apiVersion: runwhen.com/integration/v1
platform: kubernetes
title: Kubernetes
docs: https://docs.runwhen.com/integrations/kubernetes

# --- what tools read (D38, D45) ---------------------------------------------
credentialTypes:
  kubernetes/kubeconfig:
    title: kubeconfig file
    materialize: { file: { env: KUBECONFIG, mode: "0600" } }   # the whole contract a task script sees

# --- how a credential reference becomes that type (D67) -----------------------
# Each method is self-contained: it accepts its own reference kinds, has its own
# inputs, and produces the type. No method depends on another connection.
authMethods:
  kubeconfig:
    title: kubeconfig Secret
    produces: kubernetes/kubeconfig
    accepts: [k8s-secret, vault, file]       # credential-reference kinds the runner can materialize
    native: passthrough                      # the reference already is the type; runner writes it to the file
    contexts: true                           # one proposed connection per context (D50)
    inputs:
      context: { type: string, derived: true }          # read from the reference, shown, not asked
  in-cluster:
    title: In-cluster ServiceAccount
    produces: kubernetes/kubeconfig
    accepts: [in-cluster-sa]
    native: in-cluster-token                 # kubeconfig from the pod's token, CA and API server
    inputs:
      apiServer: { type: string, default: "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" }
      tokenPath: { type: string, default: /var/run/secrets/kubernetes.io/serviceaccount/token }
      serviceAccount: { type: string, derived: true }
  gke:
    title: GKE
    produces: kubernetes/kubeconfig
    accepts: [gcp-sa-key, cloud-identity]    # its own GCP credential; the script does the whole job
    script: auth/gke.py                      # kubeconfig with an exec entry: gke-gcloud-auth-plugin
    inputs:
      project:  { type: string, required: true }
      location: { type: string, required: true }
      cluster:  { type: string, required: true }
  eks: { title: EKS, produces: kubernetes/kubeconfig, accepts: [aws-access-key, cloud-identity], script: auth/eks.py, inputs: { region: { type: string, required: true }, cluster: { type: string, required: true } } }
  aks: { title: AKS, produces: kubernetes/kubeconfig, accepts: [azure-sp, cloud-identity], script: auth/aks.py, inputs: { resourceGroup: { type: string, required: true }, cluster: { type: string, required: true } } }

# --- what a task may declare and a connection verifies (CD3) ----------------
permissions:                               # D68: tasks write permissions in the source system's own terms
  schema: ./schemas/rbac-rule.json         # one permission = one RBAC rule {apiGroups, resources, verbs, nonResourceURLs?}
# There is no RunWhen vocabulary for permissions. A task declares e.g.
#   permissions: [{ apiGroups: [apps], resources: [deployments], verbs: [get, list] }]
# The platform canonicalizes and hashes each rule, asks the permissionCheck task for a verdict
# per rule, stores verdicts on the connection, and diffs required against verified.

# --- how the platform plugs this integration in (resolves CD7) ---------------
entryPoints:
  discovery:       { task: k8s-base/discover, schedule: "*/15 * * * *" }
  permissionCheck: { task: k8s-base/check-permissions }
  cli:             { task: k8s-base/kubectl }

# --- "that looks like one of mine" (D54) -----------------------------------
recognizers: []                              # kubernetes recognizes nothing; postgres and redis recognize kubernetes Services
