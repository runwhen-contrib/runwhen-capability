apiVersion: runwhen.com/custom-capability/v1
name: artifacts-bundle
description: Fixture bundle exercising artifact outputs, rw_artifact, host-side upload and spill
tasks:
  - name: dump-pipe
    file: tasks/dump_pipe.sh
    effects: [Test fixture]
    outputs:
      dump: { artifact: { contentType: text/plain, maxSize: 2Gi } }
  - name: dump-dir
    file: tasks/dump_dir.sh
    effects: [Test fixture]
    outputs:
      dump: { artifact: {} }
      report: { artifact: { contentType: application/json } }
